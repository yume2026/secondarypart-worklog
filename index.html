<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Secondary Part 업무일지</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
  :root{
    --paper:#EDF1EC;
    --surface:#FFFFFF;
    --surface-2:#F5F7F4;
    --ink:#1E2B28;
    --muted:#5C6B65;
    --faint:#8A968F;
    --line:#D3DBD3;
    --accent:#2B4570;
    --accent-ink:#1D3255;
    --accent-tint:#E4EAF3;
    --focus:#2B4570;

    --st-progress:#8A5A00;
    --st-progress-bg:#F4E7CB;
    --st-done:#1F6E4A;
    --st-done-bg:#DCEFE4;
    --st-hold:#9C3B26;
    --st-hold-bg:#F4DBD3;

    --shadow: 0 1px 2px rgba(30,43,40,.06), 0 6px 20px -8px rgba(30,43,40,.18);
  }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#141A17;
      --surface:#1B221E;
      --surface-2:#212A25;
      --ink:#E7EDE8;
      --muted:#9FAEA6;
      --faint:#6E7C74;
      --line:#2E3833;
      --accent:#8FADDA;
      --accent-ink:#C7D8F0;
      --accent-tint:#22334B;

      --st-progress:#E8B85E;
      --st-progress-bg:#3B310F;
      --st-done:#79D2A6;
      --st-done-bg:#123626;
      --st-hold:#EE9C86;
      --st-hold-bg:#3B1B14;

      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px -12px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --paper:#141A17;
    --surface:#1B221E;
    --surface-2:#212A25;
    --ink:#E7EDE8;
    --muted:#9FAEA6;
    --faint:#6E7C74;
    --line:#2E3833;
    --accent:#8FADDA;
    --accent-ink:#C7D8F0;
    --accent-tint:#22334B;

    --st-progress:#E8B85E;
    --st-progress-bg:#3B310F;
    --st-done:#79D2A6;
    --st-done-bg:#123626;
    --st-hold:#EE9C86;
    --st-hold-bg:#3B1B14;

    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px -12px rgba(0,0,0,.6);
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:"IBM Plex Sans KR","Noto Sans KR",system-ui,sans-serif;
    font-size:14.5px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--accent-tint); }
  a{ color:var(--accent); }
  button, input, textarea, select{ font-family:inherit; font-size:inherit; color:inherit; }
  :focus-visible{ outline:2px solid var(--focus); outline-offset:2px; }

  .wrap{
    max-width:1180px;
    margin:0 auto;
    padding:28px 24px 64px;
    display:flex;
    flex-direction:column;
    gap:22px;
  }

  /* ---------- header ---------- */
  .masthead{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:16px;
    padding-bottom:18px;
    border-bottom:1px solid var(--line);
    flex-wrap:wrap;
  }
  .masthead-title{
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .masthead-title h1{
    font-family:"Gowun Batang", serif;
    font-weight:700;
    font-size:34px;
    margin:0;
    letter-spacing:.01em;
    text-wrap:balance;
  }
  .masthead-title p{
    margin:0;
    color:var(--muted);
    font-size:13px;
    letter-spacing:.02em;
  }
  .masthead-date{
    text-align:right;
    font-variant-numeric:tabular-nums;
  }
  .masthead-date .big{
    font-size:15px;
    font-weight:600;
  }
  .masthead-date .small{
    font-size:12px;
    color:var(--faint);
  }

  /* ---------- member switcher ---------- */
  .switcher{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
  }
  .switcher-label{
    font-size:12px;
    color:var(--muted);
    letter-spacing:.04em;
    margin-right:2px;
  }
  .pill{
    display:flex;
    align-items:center;
    gap:6px;
    border:1px solid var(--line);
    background:var(--surface);
    border-radius:999px;
    padding:6px 8px 6px 14px;
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
  }
  .pill:hover{ border-color:var(--accent); }
  .pill.active{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }
  :root[data-theme="dark"] .pill.active, .pill.active{
    color:#fff;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .pill.active{ color:var(--paper); }
  }
  :root[data-theme="dark"] .pill.active{ color:var(--paper); }
  .pill span.name{ font-size:13.5px; font-weight:600; }
  .pill-badge{
    background:var(--st-hold);
    color:#fff;
    font-size:10px;
    font-weight:700;
    border-radius:999px;
    min-width:16px;
    height:16px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    padding:0 4px;
    font-variant-numeric:tabular-nums;
  }
  .pill.active .pill-badge{ background:#fff; color:var(--st-hold); }
  .pill button.edit{
    border:none;
    background:none;
    padding:2px;
    cursor:pointer;
    opacity:.55;
    color:inherit;
    display:flex;
  }
  .pill button.edit:hover{ opacity:1; }
  .pill.active button.edit{ color:#fff; }
  :root[data-theme="dark"] .pill.active button.edit{ color:var(--paper); }
  .pill input.rename{
    border:none;
    background:transparent;
    font-weight:600;
    font-size:13.5px;
    width:64px;
    color:inherit;
  }

  /* ---------- layout grid ---------- */
  .board{
    display:flex;
    flex-direction:column;
    gap:22px;
  }

  .panel{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    box-shadow:var(--shadow);
    padding:20px 22px 22px;
  }
  .panel-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
    margin-bottom:14px;
    flex-wrap:wrap;
  }
  .panel-head h2{
    font-size:16px;
    margin:0;
    font-weight:700;
  }
  .panel-head .meta{
    font-size:12px;
    color:var(--faint);
    font-variant-numeric:tabular-nums;
  }

  /* ---------- inbox / sent requests ---------- */
  .request-hub{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    margin-bottom:16px;
  }
  @media (max-width:720px){
    .request-hub{ grid-template-columns:1fr; }
  }
  .inbox{
    margin-bottom:0;
    padding:12px 14px;
    border:1px solid var(--line);
    border-radius:10px;
    background:var(--surface-2);
  }
  .inbox-title{
    font-size:12.5px;
    font-weight:700;
    color:var(--muted);
    margin:0 0 8px;
    letter-spacing:.02em;
  }
  .inbox-item{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
    padding:8px 0;
    border-top:1px dashed var(--line);
  }
  .inbox-item:first-child{ border-top:none; padding-top:0; }
  .inbox-item .txt{
    flex:1;
    min-width:0;
    font-size:13px;
    line-height:1.55;
    color:var(--ink);
  }
  .inbox-item .from{ font-weight:700; }
  .inbox-item .meta{ font-size:11px; color:var(--faint); font-variant-numeric:tabular-nums; }
  .inbox-item .done-btn{
    flex:none;
    border:1px solid var(--line);
    background:var(--surface);
    border-radius:7px;
    padding:6px 12px;
    font-size:11.5px;
    font-weight:600;
    color:var(--muted);
    cursor:pointer;
  }
  .inbox-item .done-btn:hover{ border-color:var(--st-done); color:var(--st-done); }
  .inbox-empty{ font-size:12.5px; color:var(--faint); }

  /* ---------- form ---------- */
  .field{
    display:flex;
    flex-direction:column;
    gap:6px;
    margin-bottom:14px;
  }
  .field label{
    font-size:12.5px;
    font-weight:600;
    color:var(--muted);
    letter-spacing:.01em;
  }
  .field input[type="date"],
  .field textarea{
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--surface-2);
    padding:9px 11px;
    color:var(--ink);
    resize:vertical;
  }
  .field input[type="date"]{ width:170px; font-variant-numeric:tabular-nums; }
  .field textarea{ width:100%; min-height:52px; line-height:1.5; }
  .field textarea:focus, .field input:focus{ background:var(--surface); border-color:var(--accent); }
  .field select{
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--surface-2);
    padding:8px 10px;
    width:230px;
  }
  .field select:focus{ background:var(--surface); border-color:var(--accent); }
  .request-row{ margin-bottom:8px; }

  /* ---------- per-task rows ---------- */
  .task-list{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .task-row-group{
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .task-row{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .task-carried-tag{
    flex:none;
    font-size:10px;
    font-weight:700;
    color:var(--accent-ink);
    background:var(--accent-tint);
    padding:4px 7px;
    border-radius:6px;
    white-space:nowrap;
  }
  .task-hold-extra{
    display:flex;
    gap:8px;
    padding-left:2px;
  }
  .task-hold-extra input, .task-hold-extra select{
    border:1px solid var(--st-hold);
    background:var(--st-hold-bg);
    border-radius:7px;
    padding:6px 9px;
    font-size:12px;
    color:var(--ink);
  }
  .task-hold-extra input{ flex:1; min-width:0; }
  .task-hold-extra select{ flex:none; width:150px; }
  .task-text{
    flex:1;
    min-width:0;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--surface-2);
    padding:8px 10px;
  }
  .task-text:focus{ background:var(--surface); border-color:var(--accent); }
  .task-status-seg{
    display:flex;
    gap:4px;
    flex:none;
  }
  .task-seg-btn{
    border:1px solid var(--line);
    background:var(--surface-2);
    border-radius:7px;
    padding:7px 8px;
    font-size:11.5px;
    font-weight:600;
    cursor:pointer;
    color:var(--muted);
    white-space:nowrap;
    transition:all .12s ease;
  }
  .task-seg-btn[data-v="progress"].active{ background:var(--st-progress-bg); border-color:var(--st-progress); color:var(--st-progress); }
  .task-seg-btn[data-v="done"].active{ background:var(--st-done-bg); border-color:var(--st-done); color:var(--st-done); }
  .task-seg-btn[data-v="hold"].active{ background:var(--st-hold-bg); border-color:var(--st-hold); color:var(--st-hold); }
  .task-remove{
    flex:none;
    width:28px;
    height:28px;
    border:1px solid var(--line);
    background:var(--surface-2);
    border-radius:7px;
    color:var(--muted);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .task-remove:hover{ border-color:var(--st-hold); color:var(--st-hold); }
  .task-empty{
    font-size:12.5px;
    color:var(--faint);
    padding:8px 2px;
  }
  .task-add{
    align-self:flex-start;
    margin-top:8px;
    background:transparent;
    border:1px dashed var(--line);
    color:var(--accent);
    border-radius:8px;
    padding:7px 14px;
    font-size:12.5px;
    font-weight:700;
    cursor:pointer;
  }
  .task-add:hover{ border-color:var(--accent); background:var(--surface-2); }

  /* ---------- proportional status bar ---------- */
  .stack-bar{
    display:flex;
    width:100%;
    height:6px;
    border-radius:999px;
    background:var(--line);
    overflow:hidden;
  }
  .stack-bar .seg{ flex:1 0 0; }
  .stack-bar .seg.done{ background:var(--st-done); }
  .stack-bar .seg.progress{ background:var(--st-progress); }
  .stack-bar .seg.hold{ background:var(--st-hold); }

  .save-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-top:6px;
    flex-wrap:wrap;
  }
  .btn-save{
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:8px;
    padding:10px 20px;
    font-size:13.5px;
    font-weight:700;
    cursor:pointer;
    transition:background .12s ease, transform .12s ease;
  }
  .btn-save:hover{ background:var(--accent-ink); }
  .btn-save:active{ transform:translateY(1px); }
  .save-status{
    font-size:12px;
    color:var(--faint);
    font-variant-numeric:tabular-nums;
  }
  .save-status.ok{ color:var(--st-done); }

  /* ---------- history ---------- */
  .history{
    margin-top:18px;
    padding-top:16px;
    border-top:1px dashed var(--line);
  }
  .history h3{
    font-size:12.5px;
    color:var(--muted);
    margin:0 0 10px;
    letter-spacing:.03em;
    font-weight:700;
  }
  .history-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:7px 4px;
    border-radius:6px;
    cursor:pointer;
    font-size:12.5px;
  }
  .history-row:hover{ background:var(--surface-2); }
  .history-row .d{ width:70px; flex:none; color:var(--muted); font-variant-numeric:tabular-nums; }
  .history-row .stack-bar{ width:56px; flex:none; }
  .history-row .w{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--ink); text-align:right; font-variant-numeric:tabular-nums; }
  .chip{
    display:inline-flex;
    align-items:center;
    padding:2px 8px;
    border-radius:999px;
    font-size:11px;
    font-weight:700;
    white-space:nowrap;
  }
  .chip.progress{ background:var(--st-progress-bg); color:var(--st-progress); }
  .chip.done{ background:var(--st-done-bg); color:var(--st-done); }
  .chip.hold{ background:var(--st-hold-bg); color:var(--st-hold); }
  .history-empty{ color:var(--faint); font-size:12.5px; padding:6px 4px; }

  /* ---------- team dashboard ---------- */
  .summary-bar{
    display:grid;
    grid-template-columns:repeat(3, auto);
    gap:20px;
    margin-bottom:16px;
  }
  .stat{
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .stat .num{
    font-size:22px;
    font-weight:700;
    font-variant-numeric:tabular-nums;
    font-family:"Gowun Batang", serif;
  }
  .stat .lbl{
    font-size:11.5px;
    color:var(--muted);
    letter-spacing:.02em;
  }

  .cards{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));
    gap:14px;
  }
  .card{
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px 16px 16px;
    background:var(--surface-2);
    display:flex;
    flex-direction:column;
    gap:8px;
    position:relative;
  }
  .card-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
  }
  .card-head .who{ font-weight:700; font-size:14px; }
  .card-head .count{
    font-size:11px;
    font-weight:700;
    color:var(--muted);
    font-variant-numeric:tabular-nums;
    flex:none;
  }
  .task-mini-list{
    list-style:none;
    margin:0;
    padding:0;
    display:flex;
    flex-direction:column;
    gap:6px;
    max-height:150px;
    overflow-y:auto;
  }
  .task-mini-list li{
    display:flex;
    align-items:flex-start;
    gap:8px;
    font-size:12.5px;
    line-height:1.45;
  }
  .task-mini-list .dot{
    width:8px;
    height:8px;
    border-radius:50%;
    margin-top:5px;
    flex:none;
  }
  .task-mini-list .dot.done{ background:var(--st-done); }
  .task-mini-list .dot.progress{ background:var(--st-progress); }
  .task-mini-list .dot.hold{ background:var(--st-hold); }
  .task-mini-list .txt{ flex:1; min-width:0; word-break:break-word; color:var(--ink); }
  .hold-note{ color:var(--st-hold); font-weight:600; }
  .card .issue{
    font-size:12px;
    color:var(--muted);
    border-top:1px dashed var(--line);
    padding-top:8px;
    line-height:1.5;
  }
  .card.empty{
    align-items:flex-start;
    justify-content:center;
    min-height:120px;
    color:var(--faint);
  }
  .card.empty .who{ color:var(--faint); }
  .card.empty .placeholder{ font-size:12.5px; }
  .card.empty.warn{ background:var(--st-hold-bg); border-color:var(--st-hold); }
  .card.empty.warn .who{ color:var(--st-hold); }
  .card.empty.warn .placeholder{ color:var(--st-hold); font-weight:700; }

  /* ---------- team search ---------- */
  .search-box{ margin-bottom:16px; position:relative; }
  .search-box input[type="search"]{
    width:100%;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--surface-2);
    padding:9px 12px;
  }
  .search-box input[type="search"]:focus{ background:var(--surface); border-color:var(--accent); }
  .search-results{
    margin-top:8px;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--surface);
    max-height:220px;
    overflow-y:auto;
  }
  .search-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px 10px;
    font-size:12.5px;
    cursor:pointer;
    border-bottom:1px solid var(--line);
  }
  .search-row:last-child{ border-bottom:none; }
  .search-row:hover{ background:var(--surface-2); }
  .search-row .d{ width:76px; flex:none; color:var(--muted); font-variant-numeric:tabular-nums; }
  .search-row .who{ width:56px; flex:none; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .search-row .txt{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--ink); }
  .search-empty{ padding:10px; font-size:12.5px; color:var(--faint); }

  /* ---------- weekly report chart ---------- */
  .week-report{
    margin-top:20px;
    padding-top:16px;
    border-top:1px dashed var(--line);
  }
  .week-report-title{
    font-size:12.5px;
    font-weight:700;
    color:var(--muted);
    margin:0 0 12px;
    letter-spacing:.02em;
  }
  .week-report-title span{
    font-weight:500;
    color:var(--faint);
    margin-left:6px;
    font-variant-numeric:tabular-nums;
  }
  .week-chart{
    display:flex;
    align-items:flex-end;
    gap:14px;
    height:120px;
    padding:0 4px;
  }
  .week-col{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    height:100%;
    justify-content:flex-end;
  }
  .week-col .total{ font-size:11px; font-weight:700; color:var(--muted); font-variant-numeric:tabular-nums; }
  .week-col .bar{
    width:100%;
    max-width:34px;
    display:flex;
    flex-direction:column-reverse;
    border-radius:4px 4px 2px 2px;
    overflow:hidden;
    background:var(--line);
    min-height:3px;
  }
  .week-col .bar .seg{ width:100%; }
  .week-col .bar .seg.done{ background:var(--st-done); }
  .week-col .bar .seg.progress{ background:var(--st-progress); }
  .week-col .bar .seg.hold{ background:var(--st-hold); }
  .week-col .lbl{ font-size:11px; color:var(--faint); font-variant-numeric:tabular-nums; }

  /* ---------- monthly calendar ---------- */
  .calendar-nav{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .cal-month-label{
    font-family:"Gowun Batang", serif;
    font-size:17px;
    font-weight:700;
    min-width:110px;
    text-align:center;
    font-variant-numeric:tabular-nums;
  }
  .calendar-weekdays{
    display:grid;
    grid-template-columns:repeat(7, 1fr);
    gap:10px;
    margin-bottom:10px;
  }
  .calendar-weekdays span{
    text-align:center;
    font-size:12px;
    font-weight:700;
    color:var(--muted);
    letter-spacing:.02em;
  }
  .calendar-weekdays span:first-child{ color:var(--st-hold); }
  .calendar-weekdays span:last-child{ color:var(--accent-ink); }
  .calendar-grid{
    display:grid;
    grid-template-columns:repeat(7, 1fr);
    gap:10px;
  }
  .cal-cell{
    min-height:126px;
    border:1px solid var(--line);
    border-radius:10px;
    padding:9px;
    display:flex;
    flex-direction:column;
    gap:8px;
    cursor:pointer;
    background:var(--surface-2);
    transition:border-color .12s ease, background .12s ease;
  }
  .cal-cell:hover{ border-color:var(--accent); }
  .cal-cell.blank{ visibility:hidden; cursor:default; }
  .cal-cell.today{ border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset; }
  .cal-cell.selected{ background:var(--accent-tint); border-color:var(--accent); }
  .cal-cell.has-schedule{ background:var(--surface); }
  .cal-cell .cal-num{
    font-size:14px;
    font-weight:700;
    font-variant-numeric:tabular-nums;
    color:var(--ink);
  }
  .cal-cell.weekend .cal-num{ color:var(--faint); }
  .cal-cell.today .cal-num{ color:var(--accent-ink); }
  .cal-cell .cal-body{
    flex:1;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .cal-cell .cal-count{
    font-size:11px;
    color:var(--muted);
    font-variant-numeric:tabular-nums;
  }
  .cal-sched-tag{
    align-self:flex-start;
    font-size:9.5px;
    font-weight:700;
    color:var(--accent-ink);
    background:transparent;
    border:1px solid var(--accent);
    padding:0 6px;
    border-radius:4px;
    letter-spacing:.02em;
  }
  .cal-sched-text{
    font-size:11px;
    color:var(--ink);
    line-height:1.4;
    overflow:hidden;
    text-overflow:ellipsis;
    display:-webkit-box;
    -webkit-line-clamp:3;
    -webkit-box-orient:vertical;
  }
  .cal-sched-edit-btn{
    align-self:flex-start;
    margin-top:auto;
    font-size:10px;
    font-weight:700;
    color:var(--muted);
    background:transparent;
    border:1px dashed var(--line);
    border-radius:5px;
    padding:2px 7px;
    cursor:pointer;
  }
  .cal-sched-edit-btn:hover{ border-color:var(--accent); color:var(--accent); }
  .cal-sched-editor{
    display:flex;
    flex-direction:column;
    gap:6px;
    height:100%;
  }
  .cal-sched-editor textarea{
    flex:1;
    min-height:44px;
    resize:none;
    border:1px solid var(--accent);
    border-radius:6px;
    background:var(--surface);
    padding:5px 7px;
    font-size:11px;
    line-height:1.35;
  }
  .cal-sched-actions{ display:flex; gap:6px; }
  .cal-sched-actions button{
    flex:1;
    font-size:10px;
    font-weight:700;
    border-radius:5px;
    padding:4px 0;
    cursor:pointer;
  }
  .cal-sched-save{ border:none; background:var(--accent); color:#fff; }
  .cal-sched-save:hover{ background:var(--accent-ink); }
  .cal-sched-cancel{ border:1px solid var(--line); background:var(--surface-2); color:var(--muted); }

  .team-date-picker{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .team-date-picker input[type="date"]{
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--surface-2);
    padding:7px 10px;
    font-size:13px;
    font-variant-numeric:tabular-nums;
  }
  .nav-btn{
    border:1px solid var(--line);
    background:var(--surface-2);
    border-radius:7px;
    width:28px;
    height:28px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    color:var(--muted);
  }
  .nav-btn:hover{ border-color:var(--accent); color:var(--accent); }

  .footnote{
    font-size:11.5px;
    color:var(--faint);
    text-align:center;
    padding-top:6px;
  }

  /* ---------- weekly notice ---------- */
  .notice-panel{
    background:var(--accent-tint);
    border:1px solid var(--line);
    border-left:4px solid var(--accent);
    border-radius:12px;
    padding:18px 22px 20px;
    box-shadow:var(--shadow);
  }
  .notice-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
    margin-bottom:10px;
  }
  .notice-title-group{
    display:flex;
    align-items:baseline;
    gap:10px;
    flex-wrap:wrap;
  }
  .notice-eyebrow{
    font-size:12.5px;
    font-weight:700;
    color:var(--accent-ink);
    letter-spacing:.04em;
  }
  .notice-range{
    font-size:12px;
    color:var(--muted);
    font-variant-numeric:tabular-nums;
  }
  .notice-author{
    font-size:12px;
    color:var(--muted);
    font-weight:600;
    white-space:nowrap;
  }
  .notice-body{ font-size:14.5px; line-height:1.65; }
  .notice-empty{ margin:0; color:var(--faint); }
  .notice-text{ margin:0; color:var(--ink); }
  .notice-edit:not([hidden]){ margin-top:10px; display:flex; flex-direction:column; gap:8px; }
  .notice-edit textarea{
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--surface);
    padding:10px 12px;
    min-height:84px;
    width:100%;
    resize:vertical;
    line-height:1.55;
  }
  .notice-edit textarea:focus{ border-color:var(--accent); }
  .notice-edit-actions{ display:flex; gap:8px; }
  .btn-ghost{
    background:transparent;
    border:1px solid var(--line);
    color:var(--muted);
    border-radius:8px;
    padding:10px 16px;
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
  }
  .btn-ghost:hover{ border-color:var(--accent); color:var(--accent); }
  .notice-toggle{
    margin-top:10px;
    background:transparent;
    border:1px dashed var(--accent);
    color:var(--accent-ink);
    border-radius:8px;
    padding:8px 14px;
    font-size:12.5px;
    font-weight:700;
    cursor:pointer;
  }
  .notice-toggle:hover{ background:var(--surface); }
  .notice-meta{
    margin:10px 0 0;
    font-size:11.5px;
    color:var(--faint);
    font-variant-numeric:tabular-nums;
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; animation:none !important; }
  }
</style>
</head>
<body>
<div class="wrap">

  <section class="panel notice-panel" id="noticePanel">
    <div class="notice-head">
      <div class="notice-title-group">
        <span class="notice-eyebrow">이번 주 중요 공지</span>
        <span class="notice-range" id="noticeRange"></span>
      </div>
      <span class="notice-author" id="noticeAuthor"></span>
    </div>
    <div class="notice-body" id="noticeBody">
      <p class="notice-empty" id="noticeEmpty">아직 이번 주 공지가 없습니다.</p>
      <p class="notice-text" id="noticeText" hidden></p>
    </div>
    <div class="notice-edit" id="noticeEdit" hidden>
      <textarea id="noticeInput" placeholder="이번 주 팀 전체에 공지할 중요 사항을 적어주세요"></textarea>
      <div class="notice-edit-actions">
        <button class="btn-save" id="noticeSave">공지 저장</button>
        <button class="btn-ghost" id="noticeCancel">취소</button>
      </div>
    </div>
    <button class="notice-toggle" id="noticeToggleBtn" type="button" hidden>공지 작성 / 수정</button>
    <p class="notice-meta" id="noticeMeta"></p>
  </section>

  <header class="masthead">
    <div class="masthead-title">
      <h1>Secondary Part 업무일지</h1>
      <p>실시간 공유 웹 버전</p>
    </div>
    <div class="masthead-date">
      <div class="big" id="todayBig">-</div>
      <div class="small" id="todaySmall">불러오는 중…</div>
    </div>
  </header>

  <div class="switcher">
    <span class="switcher-label">나는</span>
    <div id="pillRow" style="display:flex; gap:8px; flex-wrap:wrap;"></div>
  </div>

  <div class="board">

    <!-- personal entry -->
    <section class="panel">
      <div class="panel-head">
        <h2>내 업무일지</h2>
        <span class="meta" id="entryMeta"></span>
      </div>

      <div class="request-hub">
        <div class="inbox">
          <h3 class="inbox-title">나에게 온 협조 요청</h3>
          <div id="inboxList"></div>
        </div>
        <div class="inbox">
          <h3 class="inbox-title">내가 보낸 요청</h3>
          <div id="sentList"></div>
        </div>
      </div>

      <div class="field">
        <label for="entryDate">날짜</label>
        <input type="date" id="entryDate">
      </div>

      <div class="field">
        <label>오늘 업무 목록 (업무별 진행상태)</label>
        <div class="task-list" id="taskList"></div>
        <button type="button" class="task-add" id="taskAddBtn">+ 업무 추가</button>
      </div>

      <div class="field">
        <label>이슈 및 특이사항</label>
        <textarea id="fIssues" placeholder="지연 사유, 확인이 필요한 사항 등"></textarea>
      </div>

      <div class="field">
        <label>내일 계획</label>
        <textarea id="fPlan" placeholder="내일 진행할 업무"></textarea>
      </div>

      <div class="field">
        <label>협조 요청사항</label>
        <div class="request-row">
          <select id="fRequestTo"><option value="">받는 사람 선택 안 함</option></select>
        </div>
        <textarea id="fRequest" placeholder="받는 사람을 지정하면 그 사람 화면의 '나에게 온 협조 요청'에 표시됩니다"></textarea>
      </div>

      <div class="save-row">
        <button class="btn-save" id="btnSave">저장</button>
        <span class="save-status" id="saveStatus"></span>
      </div>

      <div class="history">
        <h3>지난 기록</h3>
        <div id="historyList"></div>
      </div>
    </section>

    <!-- team dashboard -->
    <section class="panel" id="teamPanel">
      <div class="panel-head">
        <h2>팀 취합 대시보드</h2>
        <div class="team-date-picker">
          <button class="nav-btn" id="teamPrev" aria-label="이전 날짜">‹</button>
          <input type="date" id="teamDate">
          <button class="nav-btn" id="teamNext" aria-label="다음 날짜">›</button>
        </div>
      </div>

      <div class="search-box">
        <input type="search" id="teamSearchInput" placeholder="업무 검색 (예: 정산, 미팅, 보고서)">
        <div class="search-results" id="searchResults" hidden></div>
      </div>

      <div class="summary-bar">
        <div class="stat">
          <span class="num" id="statAvg">–</span>
          <span class="lbl">전체 업무 완료율</span>
        </div>
        <div class="stat">
          <span class="num" id="statHold">–</span>
          <span class="lbl">보류 업무</span>
        </div>
        <div class="stat">
          <span class="num" id="statWritten">–</span>
          <span class="lbl">작성 완료 / 전체</span>
        </div>
      </div>

      <div class="cards" id="teamCards"></div>

      <div class="week-report">
        <h3 class="week-report-title">이번 주 리포트<span id="weekReportRange"></span></h3>
        <div class="week-chart" id="weekChart"></div>
      </div>

      <p class="footnote">이 페이지를 열어둔 모든 팀원에게 실시간으로 반영됩니다.</p>
    </section>

    <!-- monthly calendar -->
    <section class="panel">
      <div class="panel-head">
        <h2>월간 달력</h2>
        <div class="calendar-nav">
          <button class="nav-btn" id="calPrev" aria-label="이전 달">‹</button>
          <span class="cal-month-label" id="calMonthLabel"></span>
          <button class="nav-btn" id="calNext" aria-label="다음 달">›</button>
          <button class="btn-ghost" id="calToday" type="button">오늘</button>
        </div>
      </div>
      <div class="calendar-weekdays" id="calWeekdays"></div>
      <div class="calendar-grid" id="calendarGrid"></div>
      <p class="footnote">날짜를 클릭하면 위 팀 취합 대시보드가 그 날짜로 이동합니다.</p>
    </section>

  </div>
</div>

<script>
(function(){
  const MEMBER_IDS = ["m1","m2","m3","m4"];
  const STATUS_LABEL = { progress:"진행중", done:"완료", hold:"보류" };

  function pad(n){ return String(n).padStart(2,"0"); }
  function toDateStr(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
  function fromDateStr(s){
    const [y,m,d] = s.split("-").map(Number);
    return new Date(y, m-1, d);
  }
  function addDays(dateStr, n){
    const d = fromDateStr(dateStr);
    d.setDate(d.getDate()+n);
    return toDateStr(d);
  }
  const WEEKDAY_KR = ["일","월","화","수","목","금","토"];
  function formatDisplay(dateStr){
    const d = fromDateStr(dateStr);
    return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 (${WEEKDAY_KR[d.getDay()]})`;
  }
  function getMondayStr(dateStr){
    const d = fromDateStr(dateStr);
    const day = d.getDay();
    const diff = (day === 0 ? -6 : 1 - day);
    d.setDate(d.getDate() + diff);
    return toDateStr(d);
  }
  function formatWeekRange(weekKey){
    const mon = fromDateStr(weekKey);
    const sun = fromDateStr(addDays(weekKey, 6));
    return `${mon.getMonth()+1}.${pad(mon.getDate())} ~ ${sun.getMonth()+1}.${pad(sun.getDate())} 주`;
  }

  const now = new Date();
  const todayStr = toDateStr(now);
  document.getElementById("todayBig").textContent = formatDisplay(todayStr);
  document.getElementById("todaySmall").textContent = "오늘";

  // ---------- backend RPC bridge (Vercel API route) ----------
  function gsRun(fnName, ...args){
    return fetch("/api/rpc", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ fn: fnName, args })
    }).then(res => {
      if(!res.ok) return res.json().then(e => { throw new Error(e.error || "요청 실패"); });
      return res.json();
    });
  }

  const POLL_INTERVAL_MS = 9000;
  let pollTimer = null;

  let memberNames = { m1:"임유미", m2:"양선영", m3:"이한나", m4:"조윤서" };
  let selectedMember = localStorage.getItem("worklog_member") || "m1";
  let entryDate = todayStr;
  let teamDate = todayStr;

  let allEntriesCache = [];      // array of {memberId,date,tasks,issues,tomorrowPlan,request,requestTo,updatedAt}
  let requestsCache = [];        // array of {id,from,to,text,date,createdAt,done}
  let noticesCache = {};         // weekStart -> {weekStart,author,text,updatedAt}
  let scheduleCache = {};        // date -> {date,text,author,updatedAt}
  let openRequestsByTarget = {};
  let sentRequestsCache = [];

  const currentWeekKey = getMondayStr(todayStr);
  let noticeEditingOpen = false;
  let latestNoticeText = "";

  function entryFor(memberId, dateStr){
    for(let i=0;i<allEntriesCache.length;i++){
      const e = allEntriesCache[i];
      if(e.memberId === memberId && e.date === dateStr) return e;
    }
    return null;
  }

  function rebuildRequestViews(){
    openRequestsByTarget = {};
    requestsCache.forEach(r=>{
      if(r.done || !r.to) return;
      if(!openRequestsByTarget[r.to]) openRequestsByTarget[r.to] = [];
      openRequestsByTarget[r.to].push(r);
    });
    sentRequestsCache = requestsCache
      .filter(r=>r.from === selectedMember)
      .slice()
      .sort((a,b)=>(b.date||"").localeCompare(a.date||""))
      .slice(0, 10);
  }

  // ---------- pills ----------
  const pillRow = document.getElementById("pillRow");
  function renderPills(){
    pillRow.innerHTML = "";
    MEMBER_IDS.forEach(id=>{
      const pill = document.createElement("div");
      pill.className = "pill" + (id===selectedMember ? " active":"");
      const nameSpan = document.createElement("span");
      nameSpan.className = "name";
      nameSpan.textContent = memberNames[id] || id;
      pill.appendChild(nameSpan);

      const pendingCount = (openRequestsByTarget[id] || []).length;
      if(pendingCount > 0){
        const badge = document.createElement("span");
        badge.className = "pill-badge";
        badge.textContent = String(pendingCount);
        pill.appendChild(badge);
      }

      const editBtn = document.createElement("button");
      editBtn.className = "edit";
      editBtn.type = "button";
      editBtn.title = "이름 변경";
      editBtn.innerHTML = "&#9998;";
      editBtn.addEventListener("click", (ev)=>{
        ev.stopPropagation();
        startRename(id, pill, nameSpan);
      });
      pill.appendChild(editBtn);

      pill.addEventListener("click", ()=>{
        selectedMember = id;
        localStorage.setItem("worklog_member", id);
        rebuildRequestViews();
        renderPills();
        renderRequestToOptions();
        loadOwnEntry();
        loadHistory();
        updateNoticeEditAffordance();
        renderInbox();
        renderSentRequests();
        scheduleEditingDate = null;
        renderCalendar();
      });
      pillRow.appendChild(pill);
    });
  }

  function startRename(id, pill, nameSpan){
    const input = document.createElement("input");
    input.className = "rename";
    input.value = memberNames[id] || id;
    pill.replaceChild(input, nameSpan);
    input.focus();
    input.select();
    function commit(){
      const v = input.value.trim() || memberNames[id] || id;
      memberNames[id] = v;
      renderPills();
      renderTeam();
      gsRun("api_renameMember", id, v).catch(()=>{});
    }
    input.addEventListener("keydown",(e)=>{
      if(e.key === "Enter"){ input.blur(); }
    });
    input.addEventListener("blur", commit, { once:true });
  }

  // ---------- personal form ----------
  const entryDateInput = document.getElementById("entryDate");
  entryDateInput.value = entryDate;
  entryDateInput.max = todayStr;
  entryDateInput.addEventListener("change", ()=>{
    entryDate = entryDateInput.value || todayStr;
    loadOwnEntry();
  });

  const fIssues = document.getElementById("fIssues");
  const fPlan = document.getElementById("fPlan");
  const fRequest = document.getElementById("fRequest");
  const fRequestTo = document.getElementById("fRequestTo");
  const taskListEl = document.getElementById("taskList");
  const taskAddBtn = document.getElementById("taskAddBtn");
  const saveStatus = document.getElementById("saveStatus");
  const entryMeta = document.getElementById("entryMeta");

  let taskRows = [{ text:"", status:"progress", holdReason:"", holdWho:"" }];

  function countTasks(tasks){
    const c = { done:0, progress:0, hold:0 };
    (tasks || []).forEach(t=>{
      const s = t && t.status;
      if(Object.prototype.hasOwnProperty.call(c, s)) c[s]++;
    });
    c.total = c.done + c.progress + c.hold;
    return c;
  }

  function stackBarHtml(c){
    if(!c.total) return '<div class="stack-bar"></div>';
    const order = ["done","progress","hold"];
    const segs = order.filter(k=>c[k] > 0).map(k=>`<span class="seg ${k}" style="flex:${c[k]} 0 0"></span>`).join("");
    return `<div class="stack-bar">${segs}</div>`;
  }

  function renderTaskList(){
    taskListEl.innerHTML = "";
    if(taskRows.length === 0){
      const empty = document.createElement("div");
      empty.className = "task-empty";
      empty.textContent = "추가된 업무가 없습니다. 아래 버튼으로 업무를 추가하세요.";
      taskListEl.appendChild(empty);
      return;
    }
    taskRows.forEach((row, idx)=>{
      const group = document.createElement("div");
      group.className = "task-row-group";

      const rowEl = document.createElement("div");
      rowEl.className = "task-row";

      if(row.carried){
        const tag = document.createElement("span");
        tag.className = "task-carried-tag";
        tag.textContent = "이월";
        rowEl.appendChild(tag);
      }

      const textInput = document.createElement("input");
      textInput.type = "text";
      textInput.className = "task-text";
      textInput.placeholder = "업무 내용을 입력하세요";
      textInput.value = row.text || "";
      textInput.addEventListener("input", ()=>{ taskRows[idx].text = textInput.value; });
      rowEl.appendChild(textInput);

      const segEl = document.createElement("div");
      segEl.className = "task-status-seg";
      ["progress","done","hold"].forEach(v=>{
        const b = document.createElement("button");
        b.type = "button";
        b.className = "task-seg-btn" + (row.status === v ? " active" : "");
        b.dataset.v = v;
        b.textContent = STATUS_LABEL[v];
        b.addEventListener("click", ()=>{
          taskRows[idx].status = v;
          renderTaskList();
        });
        segEl.appendChild(b);
      });
      rowEl.appendChild(segEl);

      const rmBtn = document.createElement("button");
      rmBtn.type = "button";
      rmBtn.className = "task-remove";
      rmBtn.setAttribute("aria-label", "업무 삭제");
      rmBtn.innerHTML = "&times;";
      rmBtn.addEventListener("click", ()=>{
        taskRows.splice(idx, 1);
        renderTaskList();
      });
      rowEl.appendChild(rmBtn);

      group.appendChild(rowEl);

      if(row.status === "hold"){
        const extra = document.createElement("div");
        extra.className = "task-hold-extra";

        const reasonInput = document.createElement("input");
        reasonInput.type = "text";
        reasonInput.placeholder = "보류 사유 (필수)";
        reasonInput.value = row.holdReason || "";
        reasonInput.addEventListener("input", ()=>{ taskRows[idx].holdReason = reasonInput.value; });
        extra.appendChild(reasonInput);

        const whoSelect = document.createElement("select");
        const noneOpt = document.createElement("option");
        noneOpt.value = "";
        noneOpt.textContent = "확인 필요한 사람";
        whoSelect.appendChild(noneOpt);
        MEMBER_IDS.filter(id=>id !== selectedMember).forEach(id=>{
          const opt = document.createElement("option");

  function fillForm(data){
    const loaded = Array.isArray(data.tasks) ? data.tasks.filter(t=>t && typeof t.text === "string") : [];
    taskRows = loaded.length ? loaded.map(t=>({ text:t.text, status:t.status || "progress", holdReason:t.holdReason || "", holdWho:t.holdWho || "" })) : [{ text:"", status:"progress", holdReason:"", holdWho:"" }];
    renderTaskList();
    fIssues.value = data.issues || "";

  // carry yesterday's unfinished (진행중/보류) tasks into today's fresh, empty form
  function tryRollover(forMember, forDate){
    if(forDate !== todayStr) return;
    if(!(taskRows.length === 1 && !taskRows[0].text)) return;
    const prevEntries = allEntriesCache
      .filter(e=>e.memberId === forMember && e.date < forDate)
      .sort((a,b)=>b.date.localeCompare(a.date));
    if(prevEntries.length === 0) return;
    const prevData = prevEntries[0];
    const leftover = (prevData.tasks || []).filter(t=>t && (t.status === "progress" || t.status === "hold"));
    if(leftover.length === 0) return;
    // bail out if the user has since switched member/date
    if(selectedMember !== forMember || entryDate !== forDate) return;

    taskRows = leftover.map(t=>({
      text: t.text,
      status: t.status,
      holdReason: t.holdReason || "",
      holdWho: t.holdWho || "",
      carried: true,
    }));
    renderTaskList();
    entryMeta.textContent = "어제 마무리되지 않은 업무 " + leftover.length + "건을 이월했습니다";
  }

  function loadOwnEntry(){
    const memberAtLoad = selectedMember;
    const dateAtLoad = entryDate;
    const data = entryFor(selectedMember, entryDate);
    if(data){
      fillForm(data);
      entryMeta.textContent = data.updatedAt ? ("마지막 저장 " + new Date(data.updatedAt).toLocaleString("ko-KR")) : "";
    } else {
      clearForm();
      entryMeta.textContent = "아직 작성 전";
      tryRollover(memberAtLoad, dateAtLoad);
    }
  }

  document.getElementById("btnSave").addEventListener("click", ()=>{
    const cleanedTasks = taskRows
      .map(t=>({
        text: (t.text || "").trim(),
        status: t.status || "progress",
        holdReason: (t.holdReason || "").trim(),
        holdWho: t.holdWho || "",
      }))
      .filter(t=>t.text.length > 0);

    const missingHoldReason = cleanedTasks.find(t=>t.status === "hold" && !t.holdReason);
    if(missingHoldReason){
      saveStatus.textContent = "보류 업무는 사유를 입력해야 저장할 수 있습니다";
      saveStatus.classList.remove("ok");
      return;

    const requestTo = fRequestTo.value || "";
    const requestText = fRequest.value.trim();
    const payload = {
      memberId: selectedMember,
      date: entryDate,
      tasks: cleanedTasks,
      issues: fIssues.value.trim(),
      tomorrowPlan: fPlan.value.trim(),
      request: requestText,
      requestTo: requestTo,
    };
    saveStatus.textContent = "저장 중…";
    saveStatus.classList.remove("ok");

    gsRun("api_saveEntry", payload).then((result)=>{
      const memberAtSave = payload.memberId;
      const dateAtSave = payload.date;
      allEntriesCache = allEntriesCache.filter(e=>!(e.memberId === memberAtSave && e.date === dateAtSave));
      allEntriesCache.unshift(result.entry);

      const reqId = memberAtSave + "__" + dateAtSave;
      requestsCache = requestsCache.filter(r=>r.id !== reqId);
      if(result.request) requestsCache.push(result.request);
      rebuildRequestViews();

      saveStatus.textContent = "저장되었습니다";
      saveStatus.classList.add("ok");
      if(selectedMember === memberAtSave && entryDate === dateAtSave){
        entryMeta.textContent = "마지막 저장 " + new Date(result.entry.updatedAt).toLocaleString("ko-KR");
      }

      renderPills();
      renderInbox();
      renderSentRequests();
      renderTeam();
      renderWeekReport();
      runSearch(teamSearchInput.value);
      renderCalendar();
      loadHistory();

      saveStatus.classList.remove("ok");

  function renderTeam(){
    const latestEntriesByMember = {};
    allEntriesCache.forEach(e=>{
      if(e.date === teamDate) latestEntriesByMember[e.memberId] = e;
    });

    teamCards.innerHTML = "";
    let totalTasks = 0, totalDone = 0, totalHold = 0, written = 0;
    MEMBER_IDS.forEach(id=>{
      const data = latestEntriesByMember[id];
      const tasks = data ? (data.tasks || []) : [];
      const c = countTasks(tasks);
      const card = document.createElement("div");
      if(!data || c.total === 0){
        const isOverdue = teamDate === todayStr && new Date().getHours() >= 18;
        card.className = "card empty" + (isOverdue ? " warn" : "");
        const message = isOverdue
          ? "⚠ 아직 업무일지를 작성하지 않았습니다"
          : (data ? "오늘 등록된 업무가 없습니다" : "아직 작성 전");
        card.innerHTML = `
          <div class="card-head"><span class="who">${memberNames[id] || id}</span></div>
          <div class="placeholder">${message}</div>
        `;
        teamCards.appendChild(card);
        return;
      }
      written++;
      totalTasks += c.total;
      totalDone += c.done;
      totalHold += c.hold;
      const itemsHtml = tasks.map(t=>{
        const holdNote = (t.status === "hold" && t.holdReason)
          ? ` <span class="hold-note">— ${escapeHtml(t.holdReason)}${t.holdWho ? " (확인: " + escapeHtml(memberNames[t.holdWho] || t.holdWho) + ")" : ""}</span>`
          : "";

      }).join("");
      card.className = "card";

        <div class="card-head">

          <span class="count">${c.total}건</span>

        ${data.issues ? `<div class="issue">${escapeHtml(data.issues)}</div>` : ""}
      `;
      teamCards.appendChild(card);
    });
    statAvg.textContent = totalTasks ? Math.round((totalDone / totalTasks) * 100) + "%" : "–";
    statHold.textContent = totalHold;
    statWritten.textContent = written + " / " + MEMBER_IDS.length;

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }

  // ---------- team-wide search + weekly report ----------
  function renderWeekReport(){
    const days = [0, 1, 2, 3, 4].map(i=>addDays(currentWeekKey, i));
    const perDay = days.map(d=>({ date: d, done: 0, progress: 0, hold: 0 }));
    allEntriesCache.forEach(e=>{
      const idx = days.indexOf(e.date);
      if(idx >= 0){
        const c = countTasks(e.tasks);
        perDay[idx].done += c.done;
        perDay[idx].progress += c.progress;
        perDay[idx].hold += c.hold;
      }
    });
    const maxTotal = Math.max(1, ...perDay.map(d=>d.done + d.progress + d.hold));
    weekChartEl.innerHTML = perDay.map(d=>{
      const total = d.done + d.progress + d.hold;
      const heightPct = total ? Math.max(6, Math.round((total / maxTotal) * 100)) : 3;
      const segHtml = ["done", "progress", "hold"].filter(k=>d[k] > 0)
        .map(k=>`<span class="seg ${k}" style="flex:${d[k]} 0 0"></span>`).join("");
      const dObj = fromDateStr(d.date);
      return `<div class="week-col">
        <span class="total">${total || ""}</span>
        <div class="bar" style="height:${heightPct}%">${segHtml}</div>
        <span class="lbl">${WEEKDAY_KR[dObj.getDay()]} ${dObj.getMonth() + 1}/${dObj.getDate()}</span>
      </div>`;
    }).join("");
  }

  function runSearch(query){
    const q = (query || "").trim().toLowerCase();
    if(!q){
      searchResultsEl.hidden = true;
      searchResultsEl.innerHTML = "";
      return;
    }
    const matches = [];
    allEntriesCache.forEach(e=>{
      (e.tasks || []).forEach(t=>{
        if((t.text || "").toLowerCase().includes(q)){
          matches.push({ date: e.date, memberId: e.memberId, text: t.text, status: t.status });
        }
      });
    });
    matches.sort((a, b)=>b.date.localeCompare(a.date));
    searchResultsEl.hidden = false;
    if(matches.length === 0){
      searchResultsEl.innerHTML = '<div class="search-empty">검색 결과가 없습니다.</div>';
      return;
    }
    searchResultsEl.innerHTML = matches.slice(0, 30).map(m=>`
      <div class="search-row" data-date="${m.date}">
        <span class="d">${m.date}</span>
        <span class="who">${escapeHtml(memberNames[m.memberId] || m.memberId)}</span>
        <span class="txt">${escapeHtml(m.text)}</span>
        <span class="chip ${m.status || 'progress'}">${STATUS_LABEL[m.status || 'progress']}</span>
      </div>`).join("");
    searchResultsEl.querySelectorAll(".search-row").forEach(row=>{
      row.addEventListener("click", ()=>{
        teamDate = row.dataset.date;
        teamDateInput.value = teamDate;
        renderTeam();
        syncCalendarToTeamDate();
      });
    });
  }

  teamSearchInput.addEventListener("input", ()=>runSearch(teamSearchInput.value));

  // ---------- monthly calendar ----------
  const calMonthLabelEl = document.getElementById("calMonthLabel");
  const calWeekdaysEl = document.getElementById("calWeekdays");
  const calendarGridEl = document.getElementById("calendarGrid");
  let calendarMonthKey = todayStr.slice(0, 7); // "YYYY-MM"
  let scheduleEditingDate = null;

  function canEditSchedule(){ return selectedMember === "m1"; }

  calWeekdaysEl.innerHTML = WEEKDAY_KR.map(w=>`<span>${w}</span>`).join("");

  function daysInMonth(yearMonth){
    const [y, m] = yearMonth.split("-").map(Number);
    return new Date(y, m, 0).getDate();
  }
  function firstWeekdayOfMonth(yearMonth){
    const [y, m] = yearMonth.split("-").map(Number);
    return new Date(y, m - 1, 1).getDay();
  }
  function scrollToTeamPanel(){
    const el = document.getElementById("teamPanel");
    if(!el) return;
    const prefersReduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    el.scrollIntoView({ behavior: prefersReduced ? "auto" : "smooth", block: "start" });
  }

  function renderCalendar(){
    const [y, m] = calendarMonthKey.split("-").map(Number);
    calMonthLabelEl.textContent = y + "년 " + m + "월";

    const perDate = {};
    allEntriesCache.forEach(e=>{
      if(!e.date || e.date.slice(0, 7) !== calendarMonthKey) return;
      if(!perDate[e.date]) perDate[e.date] = { done:0, progress:0, hold:0, members:0 };
      const c = countTasks(e.tasks);
      perDate[e.date].done += c.done;
      perDate[e.date].progress += c.progress;
      perDate[e.date].hold += c.hold;
      if(c.total > 0) perDate[e.date].members += 1;
    });

    const total = daysInMonth(calendarMonthKey);
    const startWeekday = firstWeekdayOfMonth(calendarMonthKey);
    let html = "";
    for(let i = 0; i < startWeekday; i++){
      html += '<div class="cal-cell blank"></div>';
    }
    for(let day = 1; day <= total; day++){
      const dateStr = calendarMonthKey + "-" + pad(day);
      const weekday = fromDateStr(dateStr).getDay();
      const info = perDate[dateStr];
      const dayTotal = info ? info.done + info.progress + info.hold : 0;
      const sched = scheduleCache[dateStr];
      const isEditingThis = scheduleEditingDate === dateStr;

      const classes = ["cal-cell"];
      if(weekday === 0 || weekday === 6) classes.push("weekend");
      if(dateStr === todayStr) classes.push("today");
      if(dateStr === teamDate) classes.push("selected");
      if(sched && sched.text) classes.push("has-schedule");

      const dataHtml = dayTotal
        ? stackBarHtml({ done:info.done, progress:info.progress, hold:info.hold, total:dayTotal }) + `<span class="cal-count">${dayTotal}건 · ${info.members}명</span>`
        : "";

      let bodyHtml;
      if(isEditingThis){
        bodyHtml = `<div class="cal-sched-editor" data-date="${dateStr}">
          <textarea class="cal-sched-textarea" placeholder="이 날짜의 일정을 입력하세요">${escapeHtml(sched && sched.text ? sched.text : "")}</textarea>
          <div class="cal-sched-actions">
            <button type="button" class="cal-sched-save" data-date="${dateStr}">저장</button>
            <button type="button" class="cal-sched-cancel">취소</button>
          </div>
        </div>`;
      } else {
        const schedHtml = (sched && sched.text)
          ? `<span class="cal-sched-tag">일정</span><span class="cal-sched-text">${escapeHtml(sched.text)}</span>`
          : "";
        const editBtnHtml = canEditSchedule()
          ? `<button type="button" class="cal-sched-edit-btn" data-date="${dateStr}">${sched && sched.text ? "✎ 수정" : "+ 일정 추가"}</button>`
          : "";
        bodyHtml = schedHtml + dataHtml + editBtnHtml;
      }

      html += `<div class="${classes.join(' ')}" data-date="${dateStr}">
        <span class="cal-num">${day}</span>
        <div class="cal-body">${bodyHtml}</div>
      </div>`;
    }
    calendarGridEl.innerHTML = html;

    calendarGridEl.querySelectorAll(".cal-sched-editor").forEach(editor=>{
      editor.addEventListener("click", (e)=>e.stopPropagation());
    });
    calendarGridEl.querySelectorAll(".cal-sched-edit-btn").forEach(btn=>{
      btn.addEventListener("click", (e)=>{
        e.stopPropagation();
        scheduleEditingDate = btn.dataset.date;
        renderCalendar();
        const ta = calendarGridEl.querySelector('.cal-sched-editor[data-date="' + scheduleEditingDate + '"] textarea');
        if(ta) ta.focus();
      });
    });
    calendarGridEl.querySelectorAll(".cal-sched-cancel").forEach(btn=>{
      btn.addEventListener("click", (e)=>{
        e.stopPropagation();
        scheduleEditingDate = null;
        renderCalendar();
      });
    });
    calendarGridEl.querySelectorAll(".cal-sched-save").forEach(btn=>{
      btn.addEventListener("click", (e)=>{
        e.stopPropagation();
        const date = btn.dataset.date;
        const editor = btn.closest(".cal-sched-editor");
        const text = editor ? editor.querySelector("textarea").value.trim() : "";
        const author = memberNames.m1 || "임유미";
        btn.disabled = true;
        gsRun("api_saveSchedule", date, text, author).then((saved)=>{
          if(saved) scheduleCache[date] = saved;
          else delete scheduleCache[date];
          scheduleEditingDate = null;
          renderCalendar();
        }).catch(()=>{
          btn.disabled = false;
        });
      });
    });

    calendarGridEl.querySelectorAll(".cal-cell[data-date]").forEach(cell=>{
      cell.addEventListener("click", ()=>{
        teamDate = cell.dataset.date;
        teamDateInput.value = teamDate;
        renderTeam();
        renderCalendar();
        scrollToTeamPanel();
      });
    });
  }

  function monthOffset(yearMonth, n){
    const [y, m] = yearMonth.split("-").map(Number);
    const d = new Date(y, m - 1 + n, 1);
    return d.getFullYear() + "-" + pad(d.getMonth() + 1);
  }

  // ---------- weekly notice (m1 = 최고책임자, 매주 월요일 기준 주 단위 공지) ----------
  const noticeRangeEl = document.getElementById("noticeRange");

  });

  function renderNotice(){
    const data = noticesCache[currentWeekKey];
    if(data && data.text){
      latestNoticeText = data.text;
      noticeEmptyEl.hidden = true;
      noticeTextEl.hidden = false;
      noticeTextEl.innerHTML = escapeHtml(data.text).replace(/\n/g, "<br>");
      noticeAuthorEl.textContent = "작성: " + (data.author || memberNames.m1 || "임유미");
      noticeMetaEl.textContent = data.updatedAt ? ("최종 수정 " + new Date(data.updatedAt).toLocaleString("ko-KR")) : "";
    } else {
      latestNoticeText = "";
      noticeEmptyEl.hidden = false;
      noticeTextEl.hidden = true;
      noticeAuthorEl.textContent = "작성 예정: " + (memberNames.m1 || "임유미") + " · 최고책임자";
      noticeMetaEl.textContent = "";
    }
    if(!noticeEditingOpen && document.activeElement !== noticeInputEl){
      noticeInputEl.value = latestNoticeText;
    }
  }

  // ---------- polling refresh cycle ----------
  function refreshAll(){
    return gsRun("api_getAll").then(data=>{
      if(data.members) memberNames = Object.assign({}, memberNames, data.members);
      allEntriesCache = data.entries || [];
      requestsCache = data.requests || [];
      noticesCache = {};
      (data.notices || []).forEach(n=>{ if(n && n.weekStart) noticesCache[n.weekStart] = n; });
      scheduleCache = {};
      (data.schedule || []).forEach(s=>{ if(s && s.date) scheduleCache[s.date] = s; });
      rebuildRequestViews();
    });
  }

  function renderAllViews(){
    renderPills();
    renderTeam();
    renderInbox();
    renderSentRequests();
    renderWeekReport();
    runSearch(teamSearchInput.value);
    renderCalendar();
    renderNotice();
    loadHistory();
  }

  function startPolling(){
    if(pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(()=>{
      refreshAll().then(renderAllViews).catch(()=>{});
    }, POLL_INTERVAL_MS);
  }

  // ---------- boot ----------
  async function boot(){
    renderPills();
    renderRequestToOptions();
    updateNoticeEditAffordance();
    entryMeta.textContent = "불러오는 중…";

    try{
      await refreshAll();
    } catch(e){
      entryMeta.textContent = "데이터를 불러올 수 없습니다";
    }

    // default the dashboard to the most recent date with any team activity
    if(allEntriesCache.length){
      teamDate = allEntriesCache.slice().sort((a,b)=>b.date.localeCompare(a.date))[0].date;
      teamDateInput.value = teamDate;
    }
    calendarMonthKey = teamDate.slice(0, 7);

    renderRequestToOptions();
    renderAllViews();
    loadOwnEntry();

    startPolling();
  }

  boot();
})();
</script>
</body>
</html>
